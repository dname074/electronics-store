version: '2'

services:
  postgresql:
    container_name: postgresql
    image: postgres:17.10
    env_file:
      - .env
    ports:
      - 5432:5432
    networks:
      - postgres_network
      - electronics-store_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  pgadmin:
    container_name: pgadmin
    image: elestio/pgadmin:REL-9_13
    depends_on:
      - postgresql
    env_file:
      - .env
    ports:
      - 5433:5433
    networks:
      - postgres_network
    volumes:
      - pgadmin_working_dir:/var/lib/pgadmin
      - pgadmin_config_dir:/pgadmin4
  redis:
    image: redis:7.4-alpine
#    healthcheck:
#      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
#      interval: 1s
#      timeout: 3s
#      retries: 5
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASS}
    ports:
      - 6379:6379
    networks:
      - redis_network
  redis-insight:
    image: redis/redisinsight:3.4
    ports:
      - 5540:5540
    networks:
      - redis_network
    volumes:
      - redis-insight-data:/data
    depends_on:
      - redis

#  cart-service:
#    depends_on:
#      redis:
#        condition: service_healthy

networks:
  electronics-store_network:
    external: true
    driver: bridge
  postgres_network:
    driver: bridge
  redis_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_working_dir:
    driver: local
  pgadmin_config_dir:
    driver: local
  redis-insight-data:
    driver: local