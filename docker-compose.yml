services:
  postgresql:
    container_name: postgresql
    image: postgres:17.10
    env_file:
      - .env
    ports:
      - 5432:5432
    networks:
      - postgres_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  pgadmin:
    container_name: pgadmin
    image: elestio/pgadmin:REL-9_13
    depends_on:
      - postgresql
    env_file:
      - .env
    ports:
      - 5433:80
    networks:
      - postgres_network
    volumes:
      - pgadmin_working_dir:/var/lib/pgadmin
      - pgadmin_config_dir:/pgadmin4
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASS}
    ports:
      - 6379:6379
    networks:
      - redis_network
  redis-insight:
    image: redis/redisinsight:3.4
    ports:
      - 5540:5540
    networks:
      - redis_network
    volumes:
      - redis-insight-data:/data
    depends_on:
      - redis
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - 2181:2181
    networks:
      - kafka_network
  kafka:
    image: confluentinc/cp-kafka:7.4.4
    depends_on:
      - zookeeper
    ports:
      - 29092:29092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:29092, PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT, PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:29092, PLAINTEXT://0.0.0.0:9092
    networks:
      - kafka_network
  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.4
    networks:
      - kafka_network
    depends_on:
      - kafka
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka:9092'
      SCHEMA_REGISTRY_HOST_NAME: 'schema-registry'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:9097'
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: 'INFO'
    ports:
      - 9097:9097
  akhq:
    image: tchiotludo/akhq:latest
    networks:
      - kafka_network
    ports:
      - 9093:8080
    depends_on:
      - kafka
      - schema-registry
    environment:
      AKHQ_CONFIGURATION: |
        micronaut:
          security:
            enabled: true
            authentication: cookie
            token:
              jwt:
                signatures:
                  secret:
                    generator:
                      secret: "some-random-secret-key-minimum-46-characters!!"
        akhq:
          security:
            default-group: no-roles
            roles:
              registry-admin:
                - resources: [ "SCHEMA" ]
                  actions: [ "READ", "CREATE", "UPDATE", "DELETE", "DELETE_VERSION" ]
            groups:
              schema-write:
                - role: registry-admin
            basic-auth:
              - username: admin
                password: "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"
                passwordHash: SHA256
                groups:
                  - schema-write
          connections:
            docker-kafka:
              properties:
                bootstrap.servers: "kafka:9092"
              schema-registry:
                url: "http://schema-registry:9097"
  product-service:
    container_name: product-service
    image: product-service:1.0
    build:
      dockerfile: /product-service/Dockerfile
    ports:
      - 8080:8080
    networks:
      - electronics-store_network
      - postgres_network
    depends_on:
      - postgresql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/product_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
  cart-service:
    container_name: cart-service
    image: cart-service:1.0
    build:
      dockerfile: /cart-service/Dockerfile
    ports:
      - 8081:8081
    networks:
      - electronics-store_network
      - redis_network
    depends_on:
      - redis:
          condition: service_healthy
    environment:
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASS}
      - SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_PRODUCTCLIENT_URL=http://product-service:8080/
      - SPRING_DATA_REDIS_HOST=redis
      - CART_CART-PREFIX='cart:'
      - CART_TTL-HOURS=24
  order-service:
    container_name: order-service
    image: order-service:1.0
    build:
      dockerfile: /order-service/Dockerfile
    ports:
      - 8082:8082
    networks:
      - electronics-store_network
      - kafka_network
      - postgres_network
    depends_on:
      - postgresql
      - kafka
    environment:
      - SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_CARTSERVICECLIENT_URL=http://cart-service:8081/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/order_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP-SERVERS=kafka:9092
  invoice-service:
    container_name: invoice-service
    image: invoice-service:1.0
    build:
      dockerfile: /invoice-service/Dockerfile
    ports:
      - 8083:8083
    networks:
      - electronics-store_network
      - kafka_network
      - postgres_network
    depends_on:
      - postgresql
      - kafka
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/invoice_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP-SERVERS=kafka:9092
      - SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_INVOICECLIENT_URL=https://electronics-store-test-project.fakturownia.pl/
      - FAKTUROWNIA_API_TOKEN=${FAKTUROWNIA_API_TOKEN}
    env_file:
      - .env
  electronics-store-bff:
    container_name: electronics-store-bff
    image: electronics-store-bff:1.0
    build:
      dockerfile: /electronics-store-bff/Dockerfile
    ports:
      - 8084:8084
    networks:
      - electronics-store_network
    depends_on:
      - product-service
      - cart-service
      - order-service
      - invoice-service
    environment:
      - SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_PRODUCTCLIENT_URL=http://product-service:8080/
      - SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_CARTCLIENT_URL=http://cart-service:8081/
      - SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_ORDERCLIENT_URL=http://order-service:8082/
networks:
  electronics-store_network:
    external: true
    driver: bridge
  postgres_network:
    driver: bridge
  redis_network:
    driver: bridge
  kafka_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_working_dir:
    driver: local
  pgadmin_config_dir:
    driver: local
  redis-insight-data:
    driver: local