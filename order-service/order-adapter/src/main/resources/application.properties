spring.application.name=order-service
server.port=8082

# feign client configuration -> connect to cart-service
spring.cloud.openfeign.client.config.cartServiceClient.url=http://localhost:8081/

# postgres db config
spring.datasource.url=${DB_URL}/order_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

# h2 temporary config
#spring.datasource.url=jdbc:h2:mem:testdb
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=password
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.h2.console.enabled=true

# liquibase config
spring.liquibase.enabled=true
spring.liquibase.changelog=classpath:liquibase/order_db_changelog_master.yaml