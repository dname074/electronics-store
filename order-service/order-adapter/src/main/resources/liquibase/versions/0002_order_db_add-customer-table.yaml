databaseChangeLog:
  - changeSet:
      id: 3
      author: damian
      comment: "Customers table"
      changes:
        - createTable:
            tableName: order_customers
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_order_customers_id
              - column:
                  name: first_name
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: country
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: town
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: postal_code
                  type: varchar(7)
                  constraints:
                    nullable: false
              - column:
                  name: street
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: house_number
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_customers_order_id
                    referencedTableName: orders
                    referencedColumnNames: id