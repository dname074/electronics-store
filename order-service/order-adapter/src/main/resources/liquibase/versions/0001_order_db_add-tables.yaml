databaseChangeLog:
  - changeSet:
      id: 1
      author: damian
      comment: "Orders table"
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_orders_id
              - column:
                  name: order_status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: numeric(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
  - changeSet:
      id: 2
      author: damian
      comment: "Order products table"
      changes:
        - createTable:
            tableName: order_products
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_order_products_id
              - column:
                  name: sku
                  type: varchar(12)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: numeric(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: label
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: configuration_snapshot
                  type: jsonb
              - column:
                  name: order_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_products_order_id
                    referencedTableName: orders
                    referencedColumnNames: id