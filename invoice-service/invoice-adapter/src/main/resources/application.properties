spring.application.name=invoice-service
server.port=8083

# postgres db
spring.datasource.url=${DB_URL}/invoice_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

# liquibase config
spring.liquibase.enabled=true
spring.liquibase.changelog=classpath:liquibase/invoice_db_changelog_master.yaml

# feign client -> fakturownia api
spring.cloud.openfeign.client.config.invoiceClient.url=https://electronics-store-test-project.fakturownia.pl/
spring.cloud.openfeign.circuitbreaker.enabled=true
fakturownia.api.token=${FAKTUROWNIA_API_TOKEN}

# kafka config
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.group-id=order-created-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
invoice-service.group.id=invoice-service-group
app.kafka.enabled=true

# invoice config
invoice.payment-days=7
invoice.default-tax=23
invoice.kind=vat
invoice.currency=PLN
invoice.seller-name=Elec-Store
invoice.first-part-download-url=https://electronics-store-test-project.fakturownia.pl/invoices/
invoice.second-part-download-url=.pdf?api_token=${FAKTUROWNIA_API_TOKEN}